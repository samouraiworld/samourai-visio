# All visio.samourai.app deltas.
#
# Compose loads compose.yaml + compose.override.yaml together by default.
# Keeping our changes here means upstream's compose.yaml is never edited, so
# it can be re-fetched verbatim at upgrade time (RUNBOOK §10). RUNBOOK §5's
# original "uncomment these blocks in compose.yaml" instruction would be
# silently erased by that re-fetch.
#
# Merge semantics (verified on Compose v2.40.3):
#   image, command   -> REPLACE
#   environment      -> merge; on key collision `environment:` beats `env_file:`
#   networks         -> merge
#   volumes          -> merge, keyed by TARGET path (same target replaces)
#
# NEVER run bare `docker compose config` against this: it expands env_file and
# prints every secret. Use --no-env-resolution, or --images for tags.
---
services:
  postgresql:
    image: postgres:16
    restart: unless-stopped
    # journald, not json-file: the privacy policy promises IP-bearing logs are
    # deleted after 7 days, and json-file rotates by SIZE only — at low
    # traffic a size cap retains entries for months. This anchor only routes
    # every service's stdout to journald; the 7-day clock itself lives in
    # /etc/systemd/journald.conf.d/ (deploy/host/, RUNBOOK §8bis), and
    # deploy/host/daemon.json makes journald the default for containers
    # OUTSIDE this project — nginx-proxy, which logs every client IP.
    # `docker compose logs` still works: the journald driver supports it.
    logging: &logging
      driver: journald

  redis:
    # Upstream ships redis:5 (years past EOL) with no volume. Sessions are
    # cache-backed (SESSION_ENGINE=...backends.cache -> redis://redis:6379/1),
    # so an unpersisted Redis logs out every user on every restart — mid-call.
    #
    # A NAMED volume, not a bind mount: Docker creates a missing bind-mount
    # source as root:root, the image drops to uid 999, and Redis crash-loops
    # on "Can't open the append only file: Permission denied".
    #
    # noeviction because this Redis holds sessions: under an LRU policy Redis
    # would silently evict logged-in users to reclaim memory.
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  backend:
    image: lasuite/meet-backend:v1.24.0
    restart: unless-stopped
    volumes:
      # MEDIA_ROOT ONLY — never the whole /data.
      #
      # DATA_DIR=/data, MEDIA_ROOT=/data/media, STATIC_ROOT=/data/static
      # (settings.py:85,126,128). `collectstatic` runs at image build, so
      # /data/static is BAKED INTO THE IMAGE. Mounting a host directory over
      # /data therefore shadowed it with an empty tree: every /static/ URL
      # 404'd and every page Django renders itself (the admin, the DRF
      # browsable API) returned HTTP 500. Verified in production 2026-07-25 —
      # it had been broken since the deploy and nothing reported it, because
      # the SPA serves its own Vite assets from /usr/share/nginx/html/assets
      # and never touches /static.
      #
      # Mounting only the media subpath keeps uploads persistent (they would
      # otherwise die with the container on the next image change) while
      # leaving the image's static tree visible. Docker creates the source
      # directory as root:root if absent; nothing writes there while uploads
      # are disabled (config: background_image.upload_is_enabled=false), but
      # chown it to the container's uid before enabling any upload feature.
      - ./data/backend/media:/data/media
    logging: *logging

  frontend:
    image: lasuite/meet-frontend:v1.24.0
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${MEET_HOST}
      - VIRTUAL_PORT=8083
      - LETSENCRYPT_HOST=${MEET_HOST}
      # nginx-proxy adds its own "Strict-Transport-Security: max-age=31536000"
      # to any vhost it holds a certificate for, regardless of what the
      # backend returns — independent of, and in addition to, the single
      # policy our own gateway template emits (nginx/default.conf.template).
      # RFC 6797 §8.1 has the UA honour only the FIRST header, so two sources
      # is not cosmetic: whichever nginx-proxy or ours arrives first silently
      # wins over the other, and it goes undetected because both bodies
      # advertise max-age=31536000, so a curl skim looks like one header.
      # Verified live 2026-07-27: preflight.sh public genuinely counted two.
      # This env var is nginx-proxy's own per-vhost switch to stand down.
      - HSTS=off
    volumes:
      # Serves FRONTEND_CUSTOM_CSS_URL=/custom/style.css and
      # DJANGO_EMAIL_LOGO_IMG=.../custom/logo.png. Without this both return
      # 200 text/html (the SPA fallback), never 404 — so a missing mount looks
      # like a working URL. See scripts/check-hygiene.sh and RUNBOOK §8.
      #
      # NEVER bind-mount a DIRECTORY over /usr/share/nginx/html/assets: that
      # replaces Vite's build output (index-*.js, index-*.css, the MediaPipe
      # wasm) and the app will not boot. Asset overrides must be per-file.
      - ./custom:/usr/share/nginx/html/custom:ro
      # Samouraï Visio icons, PER FILE over the image's own web-root icons
      # (theme/icons/ -> host custom/icons/, RUNBOOK §7). The app's in-room
      # header logo is /assets/logo.svg (Header.tsx) — a single file inside
      # Vite's output dir, so this is the one mount allowed under /assets.
      # nginx caches /assets/* for 30 days: returning visitors may keep the
      # old header logo for up to a month. preflight asserts the content-type
      # of each (a missing source makes Docker mount a DIRECTORY: 403/500).
      - ./custom/icons/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
      - ./custom/icons/favicon-16x16.png:/usr/share/nginx/html/favicon-16x16.png:ro
      - ./custom/icons/favicon-32x32.png:/usr/share/nginx/html/favicon-32x32.png:ro
      - ./custom/icons/apple-touch-icon.png:/usr/share/nginx/html/apple-touch-icon.png:ro
      - ./custom/icons/android-chrome-192x192.png:/usr/share/nginx/html/android-chrome-192x192.png:ro
      - ./custom/icons/android-chrome-512x512.png:/usr/share/nginx/html/android-chrome-512x512.png:ro
      - ./custom/icons/android-chrome-512x512-maskable.png:/usr/share/nginx/html/android-chrome-512x512-maskable.png:ro
      - ./custom/icons/site.webmanifest:/usr/share/nginx/html/site.webmanifest:ro
      - ./custom/icons/logo.svg:/usr/share/nginx/html/assets/logo.svg:ro
      # Public landing page, served same-origin at https://<MEET_HOST>/accueil/
      # so the URL never leaves visio.samourai.app. Meet sends anonymous
      # visitors here from `/` via FRONTEND_EXTERNAL_HOME_URL; signed-in users
      # keep Meet's own home, and rooms (/<slug>) stay untouched upstream UI.
      #
      # Safe as a DIRECTORY mount (unlike /assets above) because `accueil` is a
      # new path, not an existing one in the image — nothing is shadowed.
      # The image's nginx does `try_files $uri $uri/ /index.html`, so the
      # directory resolves to its index.html.
      - ./landing:/usr/share/nginx/html/accueil:ro
      # Gateway config: REPLACES the upstream compose mount at the same
      # target (compose merges volumes by target path). Our copy is
      # upstream's template plus 301s for the three legal routes the SPA
      # hardcodes with DINUM's notices (/mentions-legales,
      # /conditions-utilisation, /accessibilite). Drift against upstream is
      # gated by check-upstream-contract.sh; deleting this line silently
      # restores upstream's mount and DINUM's pages — preflight asserts the
      # merged source path to catch exactly that.
      - ./nginx/default.conf.template:/etc/nginx/templates/docs.conf.template:ro
    networks:
      - proxy-tier
      - default
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13.4
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${LIVEKIT_HOST}
      - VIRTUAL_PORT=7880
      - LETSENCRYPT_HOST=${LIVEKIT_HOST}
      # Same nginx-proxy auto-HSTS behaviour as the frontend vhost above —
      # LiveKit emits no HSTS policy of its own, so this only prevents
      # nginx-proxy from being the sole, undocumented source of one.
      - HSTS=off
    ports:
      # TURN over UDP/443. nginx-proxy binds 443/TCP only, so 443/UDP is free
      # — no second IP required. Needs the turn: block in livekit-server.yaml.
      - "443:443/udp"
      # TURN relay allocations. LiveKit defaults this range to 30000-40000;
      # narrowed here so the published range stays manageable. Must match
      # relay_range_start/end in livekit-server.yaml, and must be open in BOTH
      # ufw and the Scaleway security group.
      #
      # This expands to 101 individual published ports. Set
      #   {"userland-proxy": false}
      # in /etc/docker/daemon.json and restart dockerd, or Docker spawns one
      # docker-proxy process per port.
      - "30000-30100:30000-30100/udp"
    depends_on:
      redis:
        # Upstream uses service_started. With no restart policy, losing the
        # boot race against Redis left LiveKit down permanently.
        condition: service_healthy
    networks:
      - proxy-tier
      - default
    logging: *logging

networks:
  proxy-tier:
    external: true

volumes:
  redis-data:
