# Journald drop-in for visio.samourai.app — the privacy policy's 7-day clock.
#
# The privacy policy (landing/confidentialite/) states that IP-bearing
# technical logs are kept 7 days, then deleted. Docker's json-file driver
# cannot honour a time bound — it rotates by SIZE only, so at low traffic it
# retains entries for months. Every container therefore logs to journald
# (compose.override.yaml `logging:` anchor for the stack, deploy/host/
# daemon.json for everything else, nginx-proxy included), and journald
# enforces the clock:
#
#   MaxRetentionSec=7day   delete entries older than 7 days
#   MaxFileSec=1day        rotate daily, so deletion granularity is one day:
#                          an entry is removed at age 7-8 days, never later
#   Storage=persistent     survive reboots — the 7-day window is a maximum,
#                          but diagnostics want the minimum to be real too
#   SystemMaxUse=1G        hard disk ceiling, whichever limit trips first
#
# All containers log through dockerd as ONE journald client and share one rate
# limit; the raised burst keeps a chatty LiveKit debug session from silently
# dropping security-relevant lines.
#
# Install (RUNBOOK §8bis):
#   sudo cp deploy/host/visio-retention.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#   sudo journalctl --rotate && sudo journalctl --vacuum-time=7d
#
# preflight.sh `config` asserts this file and these exact values on the host;
# `stack` asserts the oldest surviving entry is inside the window.
[Journal]
Storage=persistent
MaxRetentionSec=7day
MaxFileSec=1day
SystemMaxUse=1G
RateLimitIntervalSec=30s
RateLimitBurst=50000
