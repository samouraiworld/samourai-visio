services:
  runner:
    build:
      context: .
    volumes:
      - workspace:/workspace
      - ${CI_LOCAL_REPORTS:?Set the report directory}:/reports
    user: "${CI_LOCAL_UID:-1000}:${CI_LOCAL_GID:-1000}"
    environment:
      HOME: /tmp/ci-home
      USER: ci
      CI: "true"
      CI_LOCAL_BASE: ${CI_LOCAL_BASE:-origin/develop}
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /data:mode=1777
  seed:
    image: ${COMPOSE_PROJECT_NAME}-runner
    volumes:
      - ${CI_LOCAL_SNAPSHOT:?Set the isolated source snapshot}:/source:ro
      - workspace:/workspace
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp -a /source/. /workspace/
        chown -R "${CI_LOCAL_UID:-1000}:${CI_LOCAL_GID:-1000}" /workspace
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meet
      POSTGRES_USER: dinum
      POSTGRES_PASSWORD: pass
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dinum -d meet]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:5
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: meet
      MINIO_ROOT_PASSWORD: password
    command: server /data
    tmpfs:
      - /data
    healthcheck:
      test: [CMD-SHELL, 'mc alias set local http://localhost:9000 meet password >/dev/null && mc mb --ignore-existing local/meet-media-storage >/dev/null']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  workspace:
