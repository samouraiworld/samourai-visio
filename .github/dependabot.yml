version: 2

# Security updates are immediate and ungrouped (Dependabot's security updates
# ignore `schedule` and `groups` for the security PR). They also honour
# `ignore`, so no ecosystem here ignores `version-update:semver-major`: that
# entry would silence a security fix that crosses a major. Majors therefore
# arrive as pull requests. A major PR is a signal and is never merged as
# opened: the PR itself is the migration note the supply-chain policy asks
# for ("majors: issue with migration note"), and the migration lands as its
# own reviewed change.
#
# Workflow actions and the icon generator's Python only. The images in
# deploy/compose.override.yaml and deploy/greffon/visio/1.0/docker-compose.yml
# are pinned by digest and gated by scripts/check-image-digests.sh; a bump is
# a reviewed change made with scripts/resolve-image-digest.sh (RUNBOOK §10),
# and a docker ecosystem here would give two sources for the same number.
# There is no npm entry because this repository ships no JavaScript manifest.
updates:
  # Every `uses:` in this repository is pinned to a full commit SHA with the
  # readable version in a trailing comment, per samourai-core
  # `docs/security/SUPPLY_CHAIN_POLICY.md` sections 6 and 8: a workflow is
  # the one dependency that runs with repository credentials, and a tag can
  # be moved under it. That format is the configuration -- dependabot has no
  # "prefer SHA" switch, it follows whatever the workflow already carries,
  # and it rewrites the SHA and the trailing comment together when it bumps.
  # Reverting a `uses:` to a bare tag silently opts that action out of
  # pinning, so a pull request that does it is a reject, not a nit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # One PR rather than one per action: ungrouped, these arrive as a handful of
    # single-line bumps a week, get rubber-stamped, and the one that matters is
    # lost in the pile.
    groups:
      actions:
        # Capped on purpose. `patterns` with no `update-types` collects majors
        # into the weekly bundle, which is how console #50 arrived as one pull
        # request carrying six major steps under a header promising that a major
        # is never merged as opened. The configuration was manufacturing the
        # thing it forbids.
        #
        # A cap is not an `ignore` and does not reintroduce what this change
        # removes: Dependabot still opens the major, on its own, outside the
        # group, which is the signal the header asks for. Measured in this
        # organisation rather than read from documentation: console's npm `lint`
        # group is capped the same way and the eslint 9 -> 10 major arrived as
        # two individual pull requests (console #53 and #55), not suppressed.
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # `requirements-icons.txt`: the hash-pinned Pillow the icon generator draws
  # with. It arrived without an entry here, which left a pinned file nobody
  # was watching -- a pin with no watcher goes stale silently, which is the
  # supply-chain shape of a check nobody runs.
  #
  # READ THIS BEFORE MERGING A DEPENDABOT PR AGAINST THAT FILE.
  #
  # Dependabot's pip updater writes the hash of EVERY published artefact of
  # the release into a hash-pinned file -- 87 of them for Pillow 12.3.0,
  # every digest genuine. That puts back the musllinux wheel the file
  # deliberately excludes and destroys the fail-loud property its header
  # promises: the point of the curated set is that a platform change cannot
  # resolve, and 87 hashes resolve almost anything.
  #
  # So a Dependabot pull request here is a SIGNAL THAT THE PIN IS STALE, and
  # never a merge as it stands -- however green its CI is, because green is
  # exactly what it will be. The response is the recipe in
  # `requirements-icons.txt`, run by a person, in a pull request of their own,
  # with Dependabot's closed as superseded.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      python:
        patterns:
          - "*"
    # NO `ignore` here, deliberately, and it is not an oversight.
    #
    # Dependabot's SECURITY updates honour `ignore` conditions. Ignoring
    # `version-update:semver-major` on this entry would mean a Pillow security
    # release that crosses a major produces no pull request at all -- silence
    # in exactly the case the entry exists to surface. The 11.3.0 -> 12.3.0
    # bump reached us only because there was no pip entry here yet to suppress
    # it; adding one with the `ignore` the actions entry carried at the time
    # would have closed the door behind it. That `ignore` is gone from every
    # entry since: the rule below is the rule for the whole file.
    #
    # "A major is a decision, not a chore" still holds. It is enforced by the
    # rule in the comment above -- a Dependabot PR here is never merged as it
    # stands, whatever its version bump -- rather than by suppressing the
    # notification. A reader's rule surfaces the major; an `ignore` hides it.
    labels:
      - dependencies
