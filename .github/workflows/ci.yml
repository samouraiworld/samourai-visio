name: CI

on:
  # Only main on push — feature branches are covered by pull_request, so this
  # avoids running every branch twice (which also caused required checks to
  # flap between the two runs).
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly upstream-drift watch. This repo carries no application code, so
    # the thing that breaks it is upstream changing under us.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The upstream release this repo's configuration is derived from and pinned
  # to. Bump together with the tags in deploy/compose.override.yaml.
  UPSTREAM_REF: v1.24.0

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      # The gitleaks ACTION requires a paid licence for GitHub organisations.
      # The gitleaks BINARY is MIT and unrestricted, so run it directly.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/check-hygiene.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: yamllint
        run: pipx install yamllint && yamllint --strict .
      - name: shellcheck
        # shellcheck ships preinstalled on ubuntu-latest — no apt-get needed
        # (the install step was the thing that intermittently hung).
        run: shellcheck scripts/*.sh
      - name: Markdown links resolve
        run: scripts/check-links.sh

  theme-accessibility:
    name: Theme accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: scripts/check-contrast.py theme/custom.css

  # The icon generator carries three guards — the chunk allowlist, the icon
  # frame count and the mark boundary — and until now nothing re-proved any of
  # them. They were exercised by hand once and the README claimed the present
  # tense. This job is that claim made true.
  #
  # It also regenerates the set and requires the working tree to be unchanged,
  # so a committed icon that no longer matches its source is a failure rather
  # than a discovery.
  icon-generator:
    name: Icon generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Prove each guard can fail
        run: scripts/generate-icons.selftest.py
      - name: The committed icons match their source
        run: |
          set -euo pipefail
          scripts/generate-icons.py theme/icons
          if ! git diff --quiet -- theme/icons; then
            echo "::error::theme/icons does not match a fresh run of the generator"
            git --no-pager diff --stat -- theme/icons
            exit 1
          fi

  upstream-contract:
    name: Upstream contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assert pinned upstream still behaves as documented
        run: scripts/check-upstream-contract.sh "$UPSTREAM_REF"

  upstream-drift:
    name: Upstream drift (advisory)
    runs-on: ubuntu-latest
    # Advisory only: main moving is information, not a reason to block a PR.
    # A failure here means the next version bump needs a fresh drift analysis.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compare our assumptions against upstream main
        run: scripts/check-upstream-contract.sh main

  compose:
    name: Compose merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch pinned upstream compose (gitignored — never committed)
        working-directory: deploy
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/suitenumerique/meet/${UPSTREAM_REF}"
          curl -sSf -o compose.yaml "$base/docs/examples/compose/compose.yaml"
          cp hosts.example .env
          mkdir -p env.d && cp env.d/common.example env.d/common
          cp env.d/postgresql.example env.d/postgresql

      - name: Merged config is valid
        working-directory: deploy
        # --no-env-resolution: leaves env_file unexpanded, so no secret can
        # ever reach the log. Never run bare `docker compose config` here.
        run: docker compose config --no-env-resolution -q

      - name: Every image is pinned to an immutable-looking tag
        working-directory: deploy
        run: |
          set -euo pipefail
          # `grep -c latest` is NOT sufficient: an untagged image renders with
          # no tag at all and is implicitly :latest, containing no "latest".
          docker compose config --images | tee /tmp/images
          status=0
          while read -r img; do
            case "$img" in
              *:latest|*:main|*:master|*:edge) echo "::error::floating tag: $img"; status=1 ;;
              *:*) ;;
              *) echo "::error::untagged (implicitly :latest): $img"; status=1 ;;
            esac
          done < /tmp/images
          exit $status

      - name: Gateway template parses (production image's own nginx -t)
        working-directory: deploy
        # The template replaces upstream's gateway config (same mount target)
        # to 301 the SPA's hardcoded DINUM legal routes. A syntax error here
        # is a total outage: the frontend container's nginx refuses to start.
        # --add-host: `nginx -t` resolves upstream server names at parse time.
        run: |
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -e BACKEND_INTERNAL_HOST=backend -e FRONTEND_INTERNAL_HOST=frontend \
            -v "$PWD/nginx/default.conf.template:/etc/nginx/templates/docs.conf.template:ro" \
            nginxinc/nginx-unprivileged:1.30.3-alpine3.23 nginx -t

      - name: Our override merges with upstream instead of clobbering it
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose config --no-env-resolution --format json > /tmp/cfg.json
          python3 - <<'PY'
          import json, sys
          cfg = json.load(open("/tmp/cfg.json"))
          svc = cfg["services"]
          fails = []

          targets = {v.get("target") for v in svc["frontend"].get("volumes", [])}
          # Compose merges volumes keyed by TARGET. If upstream's nginx template
          # mount disappeared, the override replaced it rather than adding to it.
          for want in ("/etc/nginx/templates/docs.conf.template",
                       "/usr/share/nginx/html/custom",
                       "/usr/share/nginx/html/accueil"):
              if want not in targets:
                  fails.append(f"frontend is missing mount {want} (have: {sorted(targets)})")

          for name in ("postgresql", "redis", "backend", "frontend", "livekit"):
              if not svc[name].get("restart"):
                  fails.append(f"{name} has no restart policy — it will not survive a reboot")

          if "/data" not in {v.get("target") for v in svc["redis"].get("volumes", [])}:
              fails.append("redis has no /data volume — sessions are lost on every restart")

          for f in fails:
              print(f"::error::{f}")
          sys.exit(1 if fails else 0)
          PY

  backup-smoke:
    name: Backup end-to-end
    runs-on: ubuntu-latest
    # backup.sh guards the only rollback this deployment has, and until this
    # job existed no CI step ever EXECUTED it — shellcheck parses, it does not
    # run. The bug that motivated this job passed on a tiny fixture and failed
    # on every real dump (SIGPIPE once the decompressed dump exceeded the pipe
    # buffer), so the fixture here is deliberately multi-megabyte.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fake deploy dir with a real postgres and a local rclone remote
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          W="$RUNNER_TEMP/visio"
          mkdir -p "$W/env.d" "$W/bucket"
          # Minimal compose: backup.sh calls `docker compose exec -T postgresql`.
          cat > "$W/compose.yaml" <<'YAML'
          services:
            postgresql:
              image: postgres:16
              environment:
                POSTGRES_DB: meet
                POSTGRES_USER: meet
                POSTGRES_PASSWORD: smoke
          YAML
          cp deploy/env.d/postgresql.example "$W/env.d/postgresql"
          # rclone's local backend needs no credentials: `:local:` + a path.
          cat > "$W/env.d/backup" <<YAML
          RCLONE_CONFIG_VISIO_TYPE=local
          BACKUP_REMOTE_PATH=visio:$W/bucket/pg
          BACKUP_KEEP_LOCAL_DAYS=7
          BACKUP_KEEP_REMOTE_DAYS=30
          YAML
          chmod 600 "$W/env.d/backup"
          cd "$W" && docker compose up -d
          # TCP, not the default Unix socket, for the reason restore-drill.sh
          # spells out: the entrypoint's temporary initdb server answers on
          # the socket, so a socket probe lets the psql calls below race the
          # real server's startup. And a wait that gives up has to SAY so —
          # falling through silently turns a timeout into a confusing psql
          # error further down.
          ready=0
          for _ in $(seq 1 30); do
            if docker compose exec -T postgresql \
                 pg_isready -h 127.0.0.1 -p 5432 -U meet >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Postgres never became ready"
            exit 1
          fi
          # >10 MB of rows: large enough that the decompressed stream dwarfs
          # the pipe buffer, which is the whole point of this fixture.
          docker compose exec -T postgresql psql -q -U meet -d meet -c \
            "CREATE TABLE bulk AS SELECT g, md5(g::text)||md5((g+1)::text) AS payload
             FROM generate_series(1,200000) g"
          # The tables restore-drill.sh asserts on. django_migrations exists in
          # every Django dump regardless of usage, which is why the drill treats
          # its absence as proof the restore failed.
          docker compose exec -T postgresql psql -q -U meet -d meet -c \
            "CREATE TABLE django_migrations (id serial PRIMARY KEY, app text, name text);
             INSERT INTO django_migrations (app, name)
               VALUES ('core','0001_initial'), ('core','0002_room');
             CREATE TABLE meet_user (id serial PRIMARY KEY, email text);
             INSERT INTO meet_user (email) VALUES ('a@example.org'), ('b@example.org');
             CREATE TABLE meet_room (id serial PRIMARY KEY, slug text);
             INSERT INTO meet_room (slug) VALUES ('alpha')"

      - name: backup.sh succeeds and produces a verified off-box copy
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/visio"
          cd "$W" && VISIO_DIR="$W" "$GITHUB_WORKSPACE/scripts/backup.sh" | tee /tmp/backup.out
          grep -q '^OK ' /tmp/backup.out || { echo "::error::backup.sh did not report OK"; exit 1; }
          [ -f "$HOME/backups/LAST_OK" ] || { echo "::error::LAST_OK marker missing"; exit 1; }
          # The dump must really be in the bucket, and be big enough that the
          # SIGPIPE class of bug could have tripped.
          f="$(ls -1 "$W"/bucket/pg/visio-*.sql.gz)"
          sz="$(wc -c < "$f")"
          echo "remote object: $f ($sz bytes)"
          [ "$sz" -gt 1000000 ] ||
            { echo "::error::fixture too small for the pipe-buffer bug"; exit 1; }
          # PII must not be world-readable (umask 077 + chmod 700).
          m="$(stat -c '%a' "$(ls -1t "$HOME"/backups/visio-*.sql.gz | head -1)")"
          [ "$m" = "600" ] || { echo "::error::local dump mode $m, expected 600"; exit 1; }

      - name: restore-drill.sh restores that dump, locally and from the bucket
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/visio"
          cd "$W"
          run_drill() { VISIO_DIR="$W" "$GITHUB_WORKSPACE/scripts/restore-drill.sh" "$@"; }

          # Local mode. The drill must resolve the image from the fixture's own
          # compose file rather than reaching for a Docker Hub tag of its own.
          run_drill | tee /tmp/drill.out
          grep -q '^OK restored from local ' /tmp/drill.out ||
            { echo "::error::local drill did not report OK"; exit 1; }
          grep -q 'postgres:16' /tmp/drill.out ||
            { echo "::error::drill did not resolve the image from compose"; exit 1; }
          grep -q 'meet_user=2' /tmp/drill.out ||
            { echo "::error::row counts not asserted (expected meet_user=2)"; exit 1; }

          # Remote mode: the copy that would survive losing the host.
          run_drill --remote | tee /tmp/drill-remote.out
          grep -q '^OK restored from remote ' /tmp/drill-remote.out ||
            { echo "::error::remote drill did not report OK"; exit 1; }

      - name: And it WAITS for Postgres instead of racing its startup
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/visio"
          cd "$W"
          # The postgres entrypoint runs initdb against a TEMPORARY server it
          # starts with listen_addresses='' and stops again before the real
          # server comes up. That temporary server answers on the Unix socket,
          # so a socket pg_isready reports "accepting connections" while the
          # database is still initialising. A drill that believes that probe
          # walks into the shutdown and fails on whichever statement it had
          # reached — which is how this job produced "FAIL CREATE ROLE meet
          # failed" on a commit that touched only icons, then passed on a
          # re-run of the very same commit.
          #
          # An init script holds that window open, so the race becomes a test
          # with an answer instead of a coin flip. One value drives both the
          # hold and the elapsed threshold below: as separate literals they
          # could drift apart, and a threshold below the hold would pass a
          # drill that never waited.
          INIT_HOLD=20
          mkdir -p "$W/slowpg"
          printf '#!/bin/sh\nsleep %s\n' "$INIT_HOLD" > "$W/slowpg/00-slow-init.sh"
          chmod +x "$W/slowpg/00-slow-init.sh"
          cat > "$W/slowpg/Dockerfile" <<'DOCKER'
          FROM postgres:16
          COPY 00-slow-init.sh /docker-entrypoint-initdb.d/00-slow-init.sh
          DOCKER
          docker build -q -t visio-slow-postgres:selftest "$W/slowpg"

          # First, structurally: inside the init window the two probes must
          # DISAGREE. That disagreement is the whole reason the drill probes
          # TCP, so assert it directly rather than inferring it from a clock.
          # It also keeps this test honest — if upstream ever stops starting
          # the temporary server socket-only, this goes red rather than
          # quietly becoming a test that can no longer tell the two apart.
          docker rm -f probe-check >/dev/null 2>&1 || true
          docker run -d --name probe-check -e POSTGRES_PASSWORD=drill \
            visio-slow-postgres:selftest >/dev/null
          socket_ready=0
          for _ in $(seq 1 30); do
            if docker exec probe-check pg_isready -U postgres >/dev/null 2>&1; then
              socket_ready=1
              break
            fi
            sleep 1
          done
          if [ "$socket_ready" -ne 1 ]; then
            echo "::error::socket probe never reported ready inside the init window"
            docker rm -f probe-check >/dev/null 2>&1 || true
            exit 1
          fi
          if docker exec probe-check pg_isready -h 127.0.0.1 -p 5432 -U postgres \
               >/dev/null 2>&1; then
            echo "::error::TCP probe answered during init, so the probes no longer"\
                 "disagree and this test can no longer tell waiting from racing"
            docker rm -f probe-check >/dev/null 2>&1 || true
            exit 1
          fi
          echo "inside init: socket says ready, TCP does not — TCP is the strict probe"
          docker rm -f probe-check >/dev/null 2>&1 || true
          # That check would also pass vacuously if the TCP probe could never
          # say yes at all — a typo'd flag reads the same as "not ready". The
          # positive control is the drill run below: it polls the identical
          # probe and would fail its own readiness timeout if the answer were
          # always no. Both directions are therefore covered in this one step.

          start="$(date +%s)"
          DRILL_PG_IMAGE=visio-slow-postgres:selftest VISIO_DIR="$W" \
            "$GITHUB_WORKSPACE/scripts/restore-drill.sh" | tee /tmp/drill-slow.out
          elapsed=$(( $(date +%s) - start ))
          grep -q '^OK restored from local ' /tmp/drill-slow.out ||
            { echo "::error::drill did not survive a slow-starting Postgres"; exit 1; }
          # Corroborating the structural check above: the drill cannot have
          # finished before the init window it had to sit through had closed.
          [ "$elapsed" -ge "$INIT_HOLD" ] || {
            echo "::error::drill returned in ${elapsed}s, under the ${INIT_HOLD}s"\
                 "init hold, so it started work before Postgres was really up"
            exit 1
          }
          echo "drill waited ${elapsed}s for the real server"

      - name: And the drill FAILS when a table it asserts on is missing
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/visio"
          cd "$W"
          # A drill that prints 0 for a table that is not in the dump vouches
          # for an empty restore. Naming a table the dump cannot contain must
          # fail, not report zero.
          if DRILL_TABLES="meet_user table_that_cannot_exist" VISIO_DIR="$W" \
             "$GITHUB_WORKSPACE/scripts/restore-drill.sh" > /tmp/drill-fail.out 2>&1; then
            cat /tmp/drill-fail.out
            echo "::error::drill reported success with a missing table"; exit 1
          fi
          cat /tmp/drill-fail.out
          grep -q '^FAIL .*table_that_cannot_exist is absent' /tmp/drill-fail.out ||
            { echo "::error::no FAIL line naming the absent table"; exit 1; }

      - name: And it FAILS loudly when the remote is unwritable
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/visio"
          rm -f "$HOME/backups/LAST_OK"
          # Point at a prefix inside a read-only parent, NOT at the working
          # bucket: rclone would otherwise reuse the same-minute filename and
          # overwrite the already-writable file from the previous step, which
          # succeeds and proves nothing.
          mkdir -p "$W/readonly"
          chmod 500 "$W/readonly"
          sed -i "s|^BACKUP_REMOTE_PATH=.*|BACKUP_REMOTE_PATH=visio:$W/readonly/pg|" \
            "$W/env.d/backup"
          cd "$W"
          if VISIO_DIR="$W" "$GITHUB_WORKSPACE/scripts/backup.sh" > /tmp/fail.out 2>&1; then
            cat /tmp/fail.out
            echo "::error::reported success with an unwritable remote"; exit 1
          fi
          cat /tmp/fail.out
          grep -q '^FAIL' /tmp/fail.out ||
            { echo "::error::no FAIL line"; exit 1; }
          [ ! -f "$HOME/backups/LAST_OK" ] ||
            { echo "::error::marker written despite failure"; exit 1; }

  preflight-selftest:
    name: Preflight self-test
    runs-on: ubuntu-latest
    # Proves preflight.sh's config checks still FAIL when their defect is
    # present. A check that has quietly stopped detecting its bug is exactly
    # the failure mode this whole repo exists to prevent.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/preflight-selftest.sh
